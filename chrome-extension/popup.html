<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AJN PDF Quick Tools</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <img src="icons/icon-48.png" width="36" height="36" alt="" />
        <div>
          <div class="brand">AJN <span>PDF</span></div>
          <div class="tagline" data-i18n="quickTools">Quick Tools</div>
        </div>
      </div>
      <button id="openSite" class="icon-button" type="button" aria-label="Open AJN PDF" title="Open AJN PDF">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-9 9M19 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
      </button>
    </header>

    <section class="native-section" aria-labelledby="quick-heading">
      <div class="section-head">
        <div>
          <p class="eyebrow" data-i18n="localActions">Local quick actions</p>
          <h1 id="quick-heading" data-i18n="workSmarter">Work smarter from Chrome</h1>
        </div>
        <span class="privacy-chip" data-i18n="noPageAccess">No page access</span>
      </div>
      <div class="quick-grid">
        <button class="quick-card" data-native-tool="image-to-pdf" type="button">
          <span class="quick-icon">PDF</span><span><strong data-i18n="imageToPdf">Image to PDF</strong><small data-i18n="imageToPdfSub">Combine images into a PDF</small></span>
        </button>
        <button class="quick-card" data-native-tool="reduce-image" type="button">
          <span class="quick-icon">KB</span><span><strong data-i18n="reduceImage">Reduce Image</strong><small data-i18n="reduceImageSub">Make an image smaller</small></span>
        </button>
        <button class="quick-card" data-native-tool="resize-image" type="button">
          <span class="quick-icon">↔</span><span><strong data-i18n="resizeImage">Resize Image</strong><small data-i18n="resizeImageSub">Change image dimensions</small></span>
        </button>
        <button class="quick-card" data-native-tool="convert-image" type="button">
          <span class="quick-icon">⇄</span><span><strong data-i18n="convertImage">Convert Image</strong><small data-i18n="convertImageSub">PNG, JPG or WEBP</small></span>
        </button>
      </div>
    </section>

    <section class="catalog-section" aria-labelledby="catalog-heading">
      <div class="section-head compact">
        <div><p class="eyebrow" data-i18n="allWorkflows">AJN PDF workflows</p><h2 id="catalog-heading"><span id="toolCount">107</span> <span data-i18n="toolsLabel">tools</span></h2></div>
        <button id="clearRecent" class="text-button" type="button" hidden data-i18n="clear">Clear</button>
      </div>
      <label class="search-box" for="toolSearch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="toolSearch" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="Search 100+ tools..." />
      </label>
      <div id="filters" class="filters" role="group" aria-label="Tool categories"></div>
      <div id="recentWrap" class="recent-wrap" hidden>
        <div class="mini-label" data-i18n="recent">Recent</div>
        <div id="recentList" class="recent-list"></div>
      </div>
      <div id="results" class="results" role="listbox" aria-label="AJN PDF tool results"></div>
      <button id="openAll" class="primary-button" type="button"><span data-i18n="openAllTools">Open all AJN PDF tools</span><span aria-hidden="true">→</span></button>
    </section>

    <footer class="footer-row">
      <span data-i18n="localPrivacy">Selected images are processed inside the extension.</span>
      <button id="privacyLink" type="button" data-i18n="privacy">Privacy</button>
    </footer>
  </main>
  <script src="tools.js"></script>
  <script src="popup.js"></script>
</body>
</html>
