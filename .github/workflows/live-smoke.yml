name: AJN PDF live smoke

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ajn-pdf-live-smoke
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all 20 public routes, backend readiness, and CORS
        env:
          AJN_LIVE_BASE_URL: https://ajnpdff.vercel.app
          AJN_BACKEND_URL: https://ajn-pdf-api-580158856470.asia-south1.run.app
        run: node scripts/verify-r24-live-smoke.mjs
      - name: Verify exact backend capability parity
        env:
          AJN_BACKEND_URL: https://ajn-pdf-api-580158856470.asia-south1.run.app
        run: node scripts/verify-live-backend-contract.mjs
