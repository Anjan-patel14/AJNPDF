name: AJN PDF live smoke

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ajn-pdf-live-smoke
  cancel-in-progress: true

jobs:
  frontend-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live frontend, SEO, sitemap and AdSense ownership
        env:
          AJN_LIVE_BASE_URL: https://www.ajnpdf.com
        run: node scripts/verify-live-frontend-production.mjs

  backend-live-smoke:
    if: ${{ vars.AJN_BACKEND_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify backend readiness, capabilities and CORS
        env:
          AJN_LIVE_BASE_URL: https://www.ajnpdf.com
          AJN_BACKEND_URL: https://ajn-pdf-api-580158856470.asia-south1.run.app
        run: |
          node scripts/verify-r24-live-smoke.mjs
          node scripts/verify-live-backend-contract.mjs