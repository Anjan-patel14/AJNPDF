name: AJN PDF production quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ajn-production-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-frontend-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Run AJN PDF source gates 2-15
        run: npm run verify:gates:source
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:r13-runtime
      - name: Compile current backend Python sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          files = sorted(Path('backend').rglob('*.py'))
          if not files:
              raise SystemExit('No backend Python files found.')

          for file in files:
              py_compile.compile(str(file), doraise=True)

          print(f'PASS: compiled {len(files)} current backend Python files.')
          PY

  backend-container-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production backend image and run embedded public acceptance
        run: docker build --pull --progress=plain -t ajn-pdf-backend-ci ./backend

  package-production-source:
    needs: [source-and-frontend-gates, backend-container-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create clean production source ZIP
        run: |
          zip -rq AJN-PDF-PRODUCTION-GATES-2-15.zip . \
            -x '.git/*' 'node_modules/*' '.next/*' 'mobile-android/.gradle/*' 'mobile-android/build/*' '*.log'
      - uses: actions/upload-artifact@v4
        with:
          name: AJN-PDF-production-source
          path: AJN-PDF-PRODUCTION-GATES-2-15.zip
          if-no-files-found: error
          retention-days: 14
